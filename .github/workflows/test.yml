name: 🧪 Reusable - Test Matrix

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '[18, 20, 22]'
      os:
        type: string
        default: '["ubuntu-latest", "windows-latest"]'
      working-directory:
        type: string
        default: '.'
      coverage-flag:
        type: string
        default: 'unittests'
    secrets:
      CODECOV_TOKEN:
        required: false

jobs:
  test:
    name: Test Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ${{ fromJson(inputs.node-version) }}
        os: ${{ fromJson(inputs.os) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ inputs.working-directory }}
      - run: npm test -- --coverage --watchAll=false
        working-directory: ${{ inputs.working-directory }}

      # Condición SIMPLE en una línea - SIN multilínea, SIN ${{ }} extra
      - name: Upload coverage to Codecov
        if: secrets.CODECOV_TOKEN != '' && matrix.os == 'ubuntu-latest' && matrix.node == '20'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ${{ inputs.working-directory }}/coverage
          flags: ${{ inputs.coverage-flag }}
          name: node-${{ matrix.node }}-${{ matrix.os }}