name: 🔒 Security Audit (Dependencies)

on:
  workflow_call:
    inputs:
      max-high-vulns:
        description: 'Número máximo permitido de vulnerabilidades high+critical'
        type: number
        default: 0
      run-trivy:
        description: 'Ejecutar Trivy filesystem scan'
        type: boolean
        default: true

jobs:
  pip-audit:
    name: 📦 pip-audit (dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          pip install pip-audit jq
      - name: Run pip-audit (continue on error)
        id: audit
        continue-on-error: true
        run: |
          pip-audit --requirement requirements.txt --format json --output audit.json
      - name: Parse vulnerabilities
        id: parse
        run: |
          if [ ! -f audit.json ] || [ ! -s audit.json ]; then
            echo "audit.json missing or empty. Assuming no vulnerabilities."
            echo "high_critical=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Verificar que el JSON tiene la estructura esperada
          if jq -e '.vulnerabilities' audit.json > /dev/null 2>&1; then
            HIGH=$(jq '[.vulnerabilities[]? | select(.severity == "High" or .severity == "Critical")] | length' audit.json)
          else
            echo "Unexpected JSON structure. Assuming no vulnerabilities."
            HIGH=0
          fi
          echo "high_critical=$HIGH" >> $GITHUB_OUTPUT
          echo "Found $HIGH high/critical vulnerabilities"
      - name: Quality Gate - Enforce max high/critical
        run: |
          HIGH=${{ steps.parse.outputs.high_critical }}
          MAX=${{ inputs.max-high-vulns }}
          if [ "$HIGH" -gt "$MAX" ]; then
            echo "❌ Quality gate failed: $HIGH high/critical vulnerabilities (max allowed: $MAX)"
            exit 1
          fi
          echo "✅ Quality gate passed: $HIGH high/critical vulnerabilities (≤ $MAX)"
      - name: Upload audit report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: audit.json

  trivy-fs:
    if: inputs.run-trivy
    name: 🐳 Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload SARIF to GitHub Security tab
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif