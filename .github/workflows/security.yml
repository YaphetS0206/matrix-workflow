name: 🔒 Security Audit (Dependencies)

on:
  workflow_call:
    inputs:
      max-high-vulns:
        type: number
        default: 0
      run-trivy:
        type: boolean
        default: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pip-audit
      - name: Run pip-audit
        id: audit
        continue-on-error: true
        run: |
          pip-audit --requirement requirements.txt --format json --output audit.json
          HIGH=$(jq '[.vulnerabilities[] | select(.severity == "High" or .severity == "Critical")] | length' audit.json)
          echo "high_critical=$HIGH" >> $GITHUB_OUTPUT
      - name: Validate limit
        run: |
          HIGH=${{ steps.audit.outputs.high_critical }}
          if [ $HIGH -gt ${{ inputs.max-high-vulns }} ]; then
            echo "❌ $HIGH high/critical vulnerabilities"
            exit 1
          fi
          echo "✅ No high/critical vulnerabilities"

  trivy-fs:
    if: inputs.run-trivy
    name: Trivy filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload SARIF (optional)
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif