name: 📊 Quality Gate - Coverage

on:
  workflow_call:
    inputs:
      min-coverage:
        type: number
        default: 80

jobs:
  coverage:
    name: Validate coverage >= ${{ inputs.min-coverage }}%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install coverage

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: all-coverage
          merge-multiple: true
        continue-on-error: true   # No falla si no hay artefactos

      - name: Move .coverage files to root
        run: |
          if [ -d "all-coverage" ]; then
            find all-coverage -name ".coverage" -exec mv {} . \;
            find all-coverage -name ".coverage.*" -exec mv {} . \;
            echo "✅ Coverage files found and moved"
          else
            echo "⚠️ No coverage-data artifacts found. Skipping coverage gate."
            exit 1   # o 0 si quieres que sea opcional
          fi

      - name: Combine coverage data
        run: |
          if ls .coverage* 1> /dev/null 2>&1; then
            coverage combine
            TOTAL=$(coverage report | tail -1 | awk '{print $NF}' | sed 's/%//')
            echo "Total coverage: $TOTAL%"
            if (( $(echo "$TOTAL < ${{ inputs.min-coverage }}" | bc -l) )); then
              echo "❌ Coverage $TOTAL% is below ${{ inputs.min-coverage }}%"
              exit 1
            fi
            echo "✅ Coverage gate passed"
          else
            echo "❌ No .coverage files found. Cannot compute coverage."
            exit 1
          fi