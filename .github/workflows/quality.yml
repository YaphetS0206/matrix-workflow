name: 📊 Quality Gate - Coverage

on:
  workflow_call:
    inputs:
      min-coverage:
        type: number
        default: 80

jobs:
  coverage:
    name: Validate coverage >= ${{ inputs.min-coverage }}%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install coverage
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: all-coverage
          merge-multiple: true
      - name: Move .coverage files to root
        run: find all-coverage -name ".coverage" -exec mv {} . \;
      - name: Combine and check
        run: |
          coverage combine
          TOTAL=$(coverage report | tail -1 | awk '{print $NF}' | sed 's/%//')
          if (( $(echo "$TOTAL < ${{ inputs.min-coverage }}" | bc -l) )); then
            echo "❌ Coverage $TOTAL% < ${{ inputs.min-coverage }}%"
            exit 1
          fi
          echo "✅ Coverage $TOTAL%"