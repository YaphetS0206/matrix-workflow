name: Quality Validation

on:
  workflow_call:

jobs:

  quality:

    runs-on: ubuntu-latest

    strategy:

      matrix:
        quality-check:
          - lint
          - audit

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: ESLint
        if: matrix.quality-check == 'lint'
        run: npm run lint

      - name: npm audit
        if: matrix.quality-check == 'audit'
        run: npm audit --audit-level=high