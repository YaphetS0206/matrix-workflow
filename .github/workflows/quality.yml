name: 📊 Quality Gate - Coverage

on:
  workflow_call:
    inputs:
      min-coverage:
        type: number
        default: 80

jobs:
  coverage:
    name: Validate coverage >= ${{ inputs.min-coverage }}%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install coverage

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: all-coverage
          merge-multiple: true
        continue-on-error: true   # No falla si no hay artefactos