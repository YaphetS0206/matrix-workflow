name: Reusable Build

on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string

jobs:

  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          npm install

      # QUALITY GATE 1
      - name: Lint validation
        run: |
          cd services/${{ matrix.service }}
          npm run lint

      # QUALITY GATE 2
      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          npm test

      # QUALITY GATE 3
      - name: Validate coverage
        run: |
          cd services/${{ matrix.service }}

          COVERAGE=$(npm test -- --coverage --coverageReporters=text-summary \
            | grep Lines \
            | awk '{print $3}' \
            | sed 's/%//')

          echo "Coverage: $COVERAGE"

          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage below threshold"
            exit 1
          fi

      - name: Build Docker image
        run: |
          docker build \
            -t company/${{ matrix.service }}:${{ github.sha }} \
            services/${{ matrix.service }}