name: 🐍 Distributed Security & Quality for Python (Open Source)

on:
  workflow_call:
    inputs:
      python-versions:
        type: string
        default: '[3.9, 3.10, 3.11, 3.12]'
      min-coverage:
        type: number
        default: 80
      max-high-vulns:
        type: number
        default: 0
      run-semgrep:
        type: boolean
        default: true
      run-bandit:
        type: boolean
        default: true
      run-trivy:
        type: boolean
        default: true

# Permisos necesarios para subir SARIF a la pestaña Security
permissions:
  contents: read
  security-events: write   # ← CLAVE para upload-sarif

jobs:
  # 1. Matrix de pruebas
  test-matrix:
    name: 🧪 Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Run tests with coverage
        run: PYTHONPATH=. pytest --cov=src --cov-report=xml --cov-fail-under=${{ inputs.min-coverage }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml

  # 2. Quality gate: cobertura fusionada
  quality-coverage:
    name: 📊 Coverage gate (≥${{ inputs.min-coverage }}%)
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: all-coverage
          merge-multiple: true
      - run: pip install coverage
      - run: coverage combine all-coverage/
      - name: Check threshold
        run: |
          COVERAGE=$(coverage report | tail -1 | awk '{print $NF}' | sed 's/%//')
          if (( $(echo "$COVERAGE < ${{ inputs.min-coverage }}" | bc -l) )); then
            echo "❌ Cobertura $COVERAGE% < ${{ inputs.min-coverage }}%"
            exit 1
          fi
          echo "✅ Cobertura $COVERAGE%"

  # 3. pip-audit (sin token, usa base pública PyPI)
  audit-gate:
    name: 🔒 pip-audit (vulns en dependencias)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install pip-audit
      - name: Run pip-audit
        id: audit
        continue-on-error: true
        run: |
          pip-audit --requirement requirements.txt --format json --output audit.json
          HIGH=$(jq '[.vulnerabilities[] | select(.severity == "High" or .severity == "Critical")] | length' audit.json)
          echo "high_critical=$HIGH" >> $GITHUB_OUTPUT
      - name: Validate
        run: |
          HIGH=${{ steps.audit.outputs.high_critical }}
          if [ $HIGH -gt ${{ inputs.max-high-vulns }} ]; then
            echo "❌ $HIGH high/critical vulnerabilities"
            exit 1
          fi
          echo "✅ No high/critical vulnerabilities"

  # 4. Semgrep (SAST multi-lenguaje)
  semgrep:
    if: inputs.run-semgrep
    name: 🔍 Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          output: semgrep.sarif
      - name: Upload SARIF to GitHub Security tab
        if: success() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  # 5. Bandit (Python específico)
  bandit:
    if: inputs.run-bandit
    name: 🛡️ Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install bandit
      - run: bandit -r src -f json -o bandit.json
      - name: Check high severity
        run: |
          HIGH=$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit.json)
          if [ $HIGH -gt 0 ]; then exit 1; fi

  # 6. Trivy (escáner de vulnerabilidades en dependencias y contenedores)
  trivy:
    if: inputs.run-trivy
    name: 🐳 Trivy filesystem scan (sin token)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'