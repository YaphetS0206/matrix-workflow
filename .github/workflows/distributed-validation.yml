name: 🌐 Distributed Validation Layer

on:
  workflow_call:
    inputs:
      node-versions:
        type: string
        default: '[18, 20, 22]'
      operating-systems:
        type: string
        default: '["ubuntu-latest", "windows-latest"]'
      working-directory:
        type: string
        default: '.'
      run-lint:
        type: boolean
        default: true
      run-audit:
        type: boolean
        default: true
      run-snyk:
        type: boolean
        default: false
      upload-artifact:
        type: boolean
        default: true
      artifact-name:
        type: string
        default: 'distributed-build'
    secrets:
      SNYK_TOKEN:
        required: false

jobs:
  validate:
    name: 🔍 Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node: ${{ fromJson(inputs.node-versions) }}
        os: ${{ fromJson(inputs.operating-systems) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - run: npm ci
        working-directory: ${{ inputs.working-directory }}
      - run: npm test -- --coverage --watchAll=false || npm test
        working-directory: ${{ inputs.working-directory }}

      - name: ✨ Linter
        if: inputs.run-lint && matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: |
          npm run lint --if-present
          npm run format:check --if-present
        working-directory: ${{ inputs.working-directory }}

      - name: 🔒 npm audit
        if: inputs.run-audit && matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: npm audit --audit-level=moderate
        working-directory: ${{ inputs.working-directory }}

      - name: 🛡️ Snyk scan (if token exists)
        if: inputs.run-snyk && matrix.os == 'ubuntu-latest' && matrix.node == 20
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            npx snyk test --severity-threshold=high --all-projects
          else
            echo "SNYK_TOKEN not provided, skipping Snyk"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        working-directory: ${{ inputs.working-directory }}

      - name: 📦 Build
        run: npm run build --if-present
        working-directory: ${{ inputs.working-directory }}

      - name: 📤 Upload artifact
        if: inputs.upload-artifact && matrix.os == 'ubuntu-latest' && matrix.node == 20
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_id }}
          path: |
            ${{ inputs.working-directory }}/dist
            ${{ inputs.working-directory }}/build
          if-no-files-found: warn

  # ------------------------------------------------------------------
  # (Opcional) Job extra: reporte final de cobertura si usas Codecov
  # ------------------------------------------------------------------
  coverage-report:
    name: 📊 Coverage summary
    runs-on: ubuntu-latest
    needs: validate
    if: always() && github.event_name == 'push'
    steps:
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false