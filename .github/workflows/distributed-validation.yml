name: 🌐 Security & Quality Distributed Validation

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'Versiones de Node.js para la matriz de pruebas'
        type: string
        default: '[18, 20, 22]'
      min-coverage:
        description: 'Cobertura mínima requerida (0-100)'
        type: number
        default: 80
      max-high-vulns:
        description: 'Máximo de vulnerabilidades high+critical permitidas'
        type: number
        default: 0
      run-semgrep:
        description: 'Ejecutar análisis Semgrep'
        type: boolean
        default: true
    secrets:
      SNYK_TOKEN:  # opcional, por si quieres añadir Snyk más adelante
        required: false

jobs:
  # ============================================================
  # 1. MATRIX DE PRUEBAS (diferentes versiones de Node)
  # ============================================================
  test-matrix:
    name: 🧪 Test Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJson(inputs.node-versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Ejecutar tests con cobertura
        run: npm test -- --coverage --watchAll=false
      - name: Subir artefacto de cobertura por versión
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node }}
          path: coverage/

  # ============================================================
  # 2. QUALITY GATE: COBERTURA GLOBAL (fusión de todas las versiones)
  # ============================================================
  quality-coverage:
    name: 📊 Quality Gate - Cobertura mínima ${{ inputs.min-coverage }}%
    runs-on: ubuntu-latest
    needs: test-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar todos los reports de cobertura
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: all-coverage
          merge-multiple: true
      - name: Instalar nyc para fusionar
        run: npm install -g nyc
      - name: Fusionar coberturas
        run: npx nyc merge all-coverage .nyc_output
      - name: Generar reporte JSON
        run: npx nyc report --reporter=json-summary
      - name: Verificar umbral de cobertura
        run: |
          COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Cobertura total: $COVERAGE%"
          if (( $(echo "$COVERAGE < ${{ inputs.min-coverage }}" | bc -l) )); then
            echo "❌ Falló quality gate: cobertura $COVERAGE% es inferior a ${{ inputs.min-coverage }}%"
            exit 1
          else
            echo "✅ Quality gate de cobertura superado"
          fi

  # ============================================================
  # 3. QUALITY GATE: npm audit (vulnerabilidades high/critical)
  # ============================================================
  audit-gate:
    name: 🔒 npm audit - Máx ${{ inputs.max-high-vulns }} vulnerabilidades high+critical
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Ejecutar npm audit y extraer métricas
        id: audit
        continue-on-error: true
        run: |
          npm audit --json > audit.json
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit.json)
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit.json)
          echo "high=$HIGH" >> $GITHUB_OUTPUT
          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
      - name: Verificar límite de vulnerabilidades
        run: |
          HIGH=${{ steps.audit.outputs.high }}
          CRITICAL=${{ steps.audit.outputs.critical }}
          TOTAL=$((HIGH + CRITICAL))
          echo "Vulnerabilidades high: $HIGH, critical: $CRITICAL, total: $TOTAL"
          if [ $TOTAL -gt ${{ inputs.max-high-vulns }} ]; then
            echo "❌ Falló quality gate: se encontraron $TOTAL vulnerabilidades high/critical (máximo ${{ inputs.max-high-vulns }})"
            exit 1
          else
            echo "✅ Quality gate de vulnerabilidades superado"
          fi
      - name: Subir reporte de auditoría
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: audit.json

  # ============================================================
  # 4. SEMGREP - SAST moderno
  # ============================================================
  semgrep:
    name: 🔍 Semgrep SAST
    if: inputs.run-semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Semgrep
        id: semgrep
        continue-on-error: true
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto               # usa reglas predeterminadas (p/default, p/security-audit, etc.)
          output: semgrep.sarif
      - name: Subir resultados a la pestaña de seguridad de GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - name: (Opcional) Fallar si se encuentran hallazgos críticos
        run: |
          # Ejemplo: si quieres fallar el pipeline cuando Semgrep encuentra errores de seguridad nivel error
          # Se puede personalizar según tu criterio
          echo "✅ Escaneo Semgrep completado. Revisa la pestaña 'Security' para más detalles."

 