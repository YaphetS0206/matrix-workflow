name: 🌐 Distributed Validation - Multi-Dimensional Matrix

on:
  workflow_call:
    inputs:
      node-versions:
        type: string
        default: '[18, 20, 22]'
      databases:
        type: string
        default: '["postgres", "mysql", "sqlite"]'
      docker-architectures:
        type: string
        default: '["linux/amd64", "linux/arm64"]'
      run-integration-tests:
        type: boolean
        default: true
      run-docker-build:
        type: boolean
        default: true
    secrets:
      SNYK_TOKEN:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  # ---------- 1. Integration Tests Matrix ----------
  integration-tests:
    name: 🧪 Test Node ${{ matrix.node }} / DB ${{ matrix.db }}
    if: inputs.run-integration-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJson(inputs.node-versions) }}
        db: ${{ fromJson(inputs.databases) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci

      - name: Start PostgreSQL
        if: matrix.db == 'postgres'
        run: |
          docker run -d --name postgres -e POSTGRES_USER=testuser -e POSTGRES_PASSWORD=testpass -e POSTGRES_DB=testdb -p 5432:5432 postgres:15
          for i in {1..30}; do docker exec postgres pg_isready && break || sleep 1; done

      - name: Start MySQL
        if: matrix.db == 'mysql'
        run: |
          docker run -d --name mysql -e MYSQL_ROOT_PASSWORD=rootpass -e MYSQL_DATABASE=testdb -e MYSQL_USER=testuser -e MYSQL_PASSWORD=testpass -p 3306:3306 mysql:8
          for i in {1..30}; do docker exec mysql mysqladmin ping -h localhost --silent && break || sleep 1; done

      - name: Run integration tests
        run: npm run test:integration -- --db=${{ matrix.db }}
        env:
          DB_TYPE: ${{ matrix.db }}
          DB_HOST: localhost
          DB_PORT: ${{ matrix.db == 'postgres' && 5432 || matrix.db == 'mysql' && 3306 || '' }}
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb

      - name: Cleanup
        if: always()
        run: docker stop postgres mysql || true; docker rm postgres mysql || true

  # ---------- 2. Multi-Architecture Docker Builds ----------
  docker-build:
    name: 🐳 Docker build for ${{ matrix.arch }}
    if: inputs.run-docker-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJson(inputs.docker-architectures) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.arch }}
          load: true
          tags: app-b:${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify architecture
        run: docker run --rm app-b:${{ matrix.arch }} node -p "process.arch"

  # ---------- 3. Security Scans (cada uno en su job, sin if a nivel job) ----------
  security-snyk:
    name: 🔒 Snyk scan
    runs-on: ubuntu-latest
    steps:
      - name: Check if secret exists
        id: check
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "SNYK_TOKEN not provided, skipping Snyk scan"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Run Snyk
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
      - name: Setup Node
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        if: steps.check.outputs.skip == 'false'
        run: npm ci
      - name: Snyk scan
        if: steps.check.outputs.skip == 'false'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  security-trivy:
    name: 🛡️ Trivy fs scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  security-npm-audit:
    name: 📋 npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=moderate