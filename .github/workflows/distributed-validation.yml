name: 🌐 Full Distributed Validation

on:
  workflow_call:
    inputs:
      python-versions:
        type: string
      min-coverage:
        type: number
        default: 80
      max-high-vulns:
        type: number
        default: 0
      run-semgrep:
        type: boolean
        default: true
      run-bandit:
        type: boolean
        default: true
      run-trivy:
        type: boolean
        default: true

jobs:
  tests:
    uses: ./.github/workflows/test-python-version.yml
    with:
      python-versions: ${{ inputs.python-versions }}
      min-coverage: ${{ inputs.min-coverage }}

  coverage:
    needs: tests
    uses: ./.github/workflows/quality.yml
    with:
      min-coverage: ${{ inputs.min-coverage }}

  audit:
    uses: ./.github/workflows/security.yml
    with:
      max-high-vulns: 0
      run-trivy: true

  sast:
    uses: ./.github/workflows/sast.yml
    with:
      run-semgrep: ${{ inputs.run-semgrep }}
      run-bandit: ${{ inputs.run-bandit }}