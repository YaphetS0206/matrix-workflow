name: 🌐 Distributed Validation - Multi-Dimensional Matrix

on:
  workflow_call:
    inputs:
      node-versions:
        type: string
        default: '[18, 20, 22]'
      databases:
        type: string
        default: '["postgres", "mysql", "sqlite"]'
      docker-architectures:
        type: string
        default: '["linux/amd64", "linux/arm64"]'
      run-integration-tests:
        type: boolean
        default: true
      run-docker-build:
        type: boolean
        default: true
    secrets:
      SNYK_TOKEN:
        required: false
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  # ---------- 1. Integration Tests Matrix (Node × Database) ----------
  integration-tests:
    name: 🧪 Test Node ${{ matrix.node }} / DB ${{ matrix.db }}
    if: inputs.run-integration-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJson(inputs.node-versions) }}
        db: ${{ fromJson(inputs.databases) }}
      fail-fast: false
    services:
      postgres:
        image: postgres:15
        if: matrix.db == 'postgres'
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8
        if: matrix.db == 'mysql'
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: testdb
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - name: Run integration tests with ${{ matrix.db }}
        run: npm run test:integration -- --db=${{ matrix.db }}
        env:
          DB_HOST: localhost
          DB_PORT: ${{ matrix.db == 'postgres' && 5432 || matrix.db == 'mysql' && 3306 || '' }}
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb

  # ---------- 2. Multi-Architecture Docker Builds (matrix arquitecturas) ----------
  docker-build:
    name: 🐳 Docker build for ${{ matrix.arch }}
    if: inputs.run-docker-build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ${{ fromJson(inputs.docker-architectures) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image for ${{ matrix.arch }}
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.arch }}
          load: true
          tags: app-b:test-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test image architecture
        run: |
          docker run --rm app-b:test-${{ matrix.arch }} node -p "process.arch"
          # Verifica que la arquitectura coincida

  # ---------- 3. Distributed Security Tools (cada herramienta en su job) ----------
  security-snyk:
    name: 🔒 Snyk scan
    if: secrets.SNYK_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  security-trivy:
    name: 🛡️ Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  security-npm-audit:
    name: 📋 npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=moderate